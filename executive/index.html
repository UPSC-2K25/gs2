
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UPSC GS-II Knowledge System">
  <title>UPSC GS-II Knowledge System</title>

  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/navigation.js" defer></script>
</head>

<body>
  <header data-site-header></header>

  <div class="page-layout">

    <aside
      class="secondary-navigation"
      data-secondary-navigation
      aria-label="Module chapter navigation">
    </aside>

    <main class="main-content">

      <nav
        class="breadcrumbs"
        data-breadcrumbs
        aria-label="Breadcrumb">
      </nav>

      <section class="module-introduction">
        <h1 data-page-title></h1>

        <p data-module-description></p>

        <p data-module-explanation></p>
      </section>

      <section class="module-study-guidance">
        <h2>Study Guidance</h2>
        <ul data-study-guidance-list></ul>
      </section>

      <section class="module-exam-relevance">
        <h2>Examination Relevance</h2>
        <p data-exam-relevance-text></p>
      </section>

      <section class="module-chapter-directory">
        <h2>Chapters in This Module</h2>
        <ol data-chapter-list></ol>
      </section>

    </main>
  </div>

  <footer data-site-footer></footer>
</body>
</html>
